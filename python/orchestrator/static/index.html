<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  /* ---------- DARK THEME (black + emerald + orange) ---------- */
  html[data-theme="dark"] {
    --bg: #070907;
    --surface: #0F1512;
    --bubble-user: #10B981;
    --bubble-user-text: #04160E;
    --bubble-agent: #151C18;
    --bubble-agent-text: #E7EFE9;
    --border: #1E2C24;
    --accent: #10B981;
    --accent-dim: #0B7A56;
    --accent-secondary: #F5A623;
    --text: #E7EFE9;
    --text-dim: #6E8478;
    --error: #E0645F;
  }

  /* ---------- LIGHT THEME (white + maroon) ---------- */
  html[data-theme="light"] {
    --bg: #FFFFFF;
    --surface: #FBF6F6;
    --bubble-user: #7A1F2B;
    --bubble-user-text: #FFF7F5;
    --bubble-agent: #F2E7E7;
    --bubble-agent-text: #2A1315;
    --border: #E7D6D6;
    --accent: #7A1F2B;
    --accent-dim: #5C1520;
    --accent-secondary: #B5652F;
    --text: #2A1315;
    --text-dim: #9C7C7C;
    --error: #B5342A;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    display: flex;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  .app {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    letter-spacing: -0.5px;
    transition: background 0.2s ease;
  }
  .avatar.thinking { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .header-text { flex: 1; }
  .header-text h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }
  .header-text p {
    font-size: 11.5px;
    color: var(--accent);
    margin: 2px 0 0;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .header-text p::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 13px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--accent-dim); color: var(--accent); }

  main {
    flex: 1;
    padding: 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    max-width: 320px;
    line-height: 1.6;
  }

  .msg-row { display: flex; margin: 3px 0; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.agent { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    width: fit-content;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.5;
    overflow-wrap: break-word;
    white-space: pre-wrap;
  }
  .bubble.user {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .bubble.agent {
    background: var(--bubble-agent);
    color: var(--bubble-agent-text);
    border-bottom-left-radius: 4px;
  }

  .timestamp {
    font-size: 10.5px;
    color: var(--text-dim);
    margin: 3px 4px 10px;
    font-family: var(--font-mono);
  }
  .msg-row.user + .timestamp { text-align: right; }

  /* ---------- typing indicator ---------- */
  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 13px 16px;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .error-bubble {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--error);
    font-size: 13.5px;
  }
  .error-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--error); flex-shrink: 0; }

  .composer-wrap {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 12px 20px 16px;
  }

  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .example-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 11px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .example-chip:hover { border-color: var(--accent-dim); color: var(--accent); }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 6px 6px 6px 18px;
  }
  .input-row:focus-within { border-color: var(--accent-dim); }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    padding: 10px 0;
    outline: none;
  }
  input[type="text"]::placeholder { color: var(--text-dim); }

  button.send-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  button.send-btn:active { transform: scale(0.92); }
  button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  button.send-btn svg { width: 17px; height: 17px; }

  footer {
    text-align: center;
    padding: 6px 20px 14px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    background: var(--bg);
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="avatar" id="avatar">☺</div>
    <div class="header-text">
      <h1>Assistant</h1>
      <p>online</p>
    </div>
    <div class="theme-toggle" id="theme-toggle">
      <span id="theme-icon">☾</span>
      <span id="theme-label">dark</span>
    </div>
  </header>

  <main id="log">
    <p class="empty-state" id="placeholder">Say hi to start the conversation.</p>
  </main>

  <div class="composer-wrap">
    <div class="examples">
      <span class="example-chip" data-task="Hi there">say hi</span>
      <span class="example-chip" data-task="I want to return an item">start a flow</span>
      <span class="example-chip" data-task="What is the capital of France?">ask a question</span>
    </div>
    <div class="input-row">
      <input type="text" id="task-input" placeholder="Type a message…" />
      <button class="send-btn" id="run-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11.5L21 3L13 21L11 13L3 11.5Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>

  <footer>&copy; Anshuman Pandey</footer>

</div>

<script>
  const API_URL = "";

  const input = document.getElementById("task-input");
  const btn = document.getElementById("run-btn");
  const log = document.getElementById("log");
  const placeholder = document.getElementById("placeholder");
  const avatar = document.getElementById("avatar");
  const themeToggle = document.getElementById("theme-toggle");
  const themeIcon = document.getElementById("theme-icon");
  const themeLabel = document.getElementById("theme-label");
  const html = document.documentElement;

  // ---------- per-theme expression sets ----------
  // dark = calm/cool emerald mood, light = warm maroon mood — the square's
  // "personality" shifts with the theme, not just its color.
  const FACE_SETS = {
    dark: {
      idle: "☺",
      thinking: ["◔", "◑", "◕", "○"],
      success: "^‿^",
      error: "×_×"
    },
    light: {
      idle: "❀",
      thinking: ["◜", "◝", "◞", "◟"],
      success: "◠‿◠",
      error: "⌐■"
    }
  };

  let thinkTimer = null;
  let currentTheme = "dark";

  function faces() { return FACE_SETS[currentTheme]; }

  function setFace(state) {
    if (thinkTimer) { clearInterval(thinkTimer); thinkTimer = null; }
    avatar.classList.toggle("thinking", state === "thinking");
    const f = faces();
    if (state === "thinking") {
      let i = 0;
      avatar.textContent = f.thinking[0];
      thinkTimer = setInterval(() => {
        i = (i + 1) % f.thinking.length;
        avatar.textContent = f.thinking[i];
      }, 420);
    } else {
      avatar.textContent = f[state] || f.idle;
    }
  }

  // ---------- theme toggle ----------
  themeToggle.addEventListener("click", () => {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", currentTheme);
    themeIcon.textContent = currentTheme === "dark" ? "☾" : "☀";
    themeLabel.textContent = currentTheme;
    setFace("idle");
  });

  document.querySelectorAll(".example-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      input.value = chip.dataset.task;
      input.focus();
    });
  });

  btn.addEventListener("click", runTask);
  input.addEventListener("keydown", e => { if (e.key === "Enter") runTask(); });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // Guards against answers that repeat their entire content once.
  function dedupeRepeatedAnswer(text) {
    if (text.includes("```")) return text;
    const normalize = s => s.toLowerCase().replace(/\s+/g, " ").trim();

    const paras = text.split(/\n+/).map(p => p.trim()).filter(Boolean);
    if (paras.length >= 2) {
      const out = [];
      for (const p of paras) {
        const norm = normalize(p);
        const lastNorm = out.length ? normalize(out[out.length - 1]) : null;
        if (norm === lastNorm) continue;
        out.push(p);
      }
      if (out.length < paras.length) return out.join("\n\n");
    }

    const trimmed = text.trim();
    const n = trimmed.length;
    for (let sep = 0; sep <= 3; sep++) {
      if (n - sep <= 0 || (n - sep) % 2 !== 0) continue;
      const partLen = (n - sep) / 2;
      const a = trimmed.slice(0, partLen).trim();
      const b = trimmed.slice(partLen + sep).trim();
      if (a.length > 0 && normalize(a) === normalize(b)) return a;
    }
    return text;
  }

  function addRow(role, contentEl) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;
    row.appendChild(contentEl);
    log.appendChild(row);
    return row;
  }

  function addTimestamp(align) {
    const ts = document.createElement("div");
    ts.className = "timestamp";
    ts.style.textAlign = align;
    ts.style.marginLeft = align === "right" ? "auto" : "4px";
    ts.style.width = "fit-content";
    ts.textContent = nowTime();
    log.appendChild(ts);
  }

  async function runTask() {
    const task = input.value.trim();
    if (!task) return;

    if (placeholder) placeholder.remove();

    btn.disabled = true;
    setFace("thinking");
    input.value = "";

    // user bubble
    const userBubble = document.createElement("div");
    userBubble.className = "bubble user";
    userBubble.textContent = task;
    addRow("user", userBubble);
    addTimestamp("right");

    // typing indicator (agent)
    const typingBubble = document.createElement("div");
    typingBubble.className = "bubble agent typing-bubble";
    typingBubble.innerHTML = `<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>`;
    const typingRow = addRow("agent", typingBubble);
    log.scrollTop = log.scrollHeight;

    let data;
    let errorMsg = null;
    try {
      const res = await fetch(`${API_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: task })
      });
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      data = await res.json();
    } catch (err) {
      errorMsg = err.message || String(err);
    }

    btn.disabled = false;

    if (errorMsg) {
      setFace("error");
      typingRow.remove();
      const errBubble = document.createElement("div");
      errBubble.className = "bubble agent";
      errBubble.innerHTML = `<div class="error-bubble"><span class="error-dot"></span><span>${escapeHtml(errorMsg)}</span></div>`;
      addRow("agent", errBubble);
      addTimestamp("left");
      log.scrollTop = log.scrollHeight;
      return;
    }

    setFace("success");
    typingRow.remove();
    const agentBubble = document.createElement("div");
    agentBubble.className = "bubble agent";
    agentBubble.textContent = dedupeRepeatedAnswer(String(data.answer));
    addRow("agent", agentBubble);
    addTimestamp("left");

    log.scrollTop = log.scrollHeight;
    input.focus();

    setTimeout(() => { if (!thinkTimer) setFace("idle"); }, 2500);
  }
</script>
</body>
</html>
